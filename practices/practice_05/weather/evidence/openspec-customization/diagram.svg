<svg id="weather-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 1211.125px;" viewBox="0 0 1211.125 94" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#weather-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#weather-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#weather-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#weather-diagram .error-icon{fill:#552222;}#weather-diagram .error-text{fill:#552222;stroke:#552222;}#weather-diagram .edge-thickness-normal{stroke-width:1px;}#weather-diagram .edge-thickness-thick{stroke-width:3.5px;}#weather-diagram .edge-pattern-solid{stroke-dasharray:0;}#weather-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#weather-diagram .edge-pattern-dashed{stroke-dasharray:3;}#weather-diagram .edge-pattern-dotted{stroke-dasharray:2;}#weather-diagram .marker{fill:#666;stroke:#666;}#weather-diagram .marker.cross{stroke:#666;}#weather-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#weather-diagram p{margin:0;}#weather-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#000000;}#weather-diagram .cluster-label text{fill:#333;}#weather-diagram .cluster-label span{color:#333;}#weather-diagram .cluster-label span p{background-color:transparent;}#weather-diagram .label text,#weather-diagram span{fill:#000000;color:#000000;}#weather-diagram .node rect,#weather-diagram .node circle,#weather-diagram .node ellipse,#weather-diagram .node polygon,#weather-diagram .node path{fill:#eee;stroke:#999;stroke-width:1px;}#weather-diagram .rough-node .label text,#weather-diagram .node .label text,#weather-diagram .image-shape .label,#weather-diagram .icon-shape .label{text-anchor:middle;}#weather-diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#weather-diagram .rough-node .label,#weather-diagram .node .label,#weather-diagram .image-shape .label,#weather-diagram .icon-shape .label{text-align:center;}#weather-diagram .node.clickable{cursor:pointer;}#weather-diagram .root .anchor path{fill:#666!important;stroke-width:0;stroke:#666;}#weather-diagram .arrowheadPath{fill:#333333;}#weather-diagram .edgePath .path{stroke:#666;stroke-width:2.0px;}#weather-diagram .flowchart-link{stroke:#666;fill:none;}#weather-diagram .edgeLabel{background-color:white;text-align:center;}#weather-diagram .edgeLabel p{background-color:white;}#weather-diagram .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#weather-diagram .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#weather-diagram .cluster rect{fill:hsl(0, 0%, 98.9215686275%);stroke:#707070;stroke-width:1px;}#weather-diagram .cluster text{fill:#333;}#weather-diagram .cluster span{color:#333;}#weather-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#weather-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#000000;}#weather-diagram rect.text{fill:none;stroke-width:0;}#weather-diagram .icon-shape,#weather-diagram .image-shape{background-color:white;text-align:center;}#weather-diagram .icon-shape p,#weather-diagram .image-shape p{background-color:white;padding:2px;}#weather-diagram .icon-shape rect,#weather-diagram .image-shape rect{opacity:0.5;background-color:white;fill:white;}#weather-diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#weather-diagram .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:rev